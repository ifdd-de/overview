name: Diagrams

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: SVGs match their PlantUML sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java and Graphviz (PlantUML)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-jre-headless graphviz

      - name: Check
        run: tools/diagrams/render.sh --check
